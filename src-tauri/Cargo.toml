[package]
name = "oyun-arsivim"
version = "0.7.0"
description = "Windows için akıllı oyun kütüphanesi ve başlatıcı"
authors = ["Oyun Arşivim"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
# Windows'ta bin ile çakışmaması için lib adı farklı olmalı (cargo#8519).
name = "oyun_arsivim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
tracing = "0.1.44"
ureq = { version = "3.2.1", features = ["rustls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tracing-appender = "0.2.5"
notify = { version = "8.2.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Input_XboxController", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_System_Power", "Win32_System_SystemServices", "Management_Deployment", "ApplicationModel", "Foundation_Collections", "Storage"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
