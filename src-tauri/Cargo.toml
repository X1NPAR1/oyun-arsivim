[package]
name = "oyun-arsivim"
version = "0.2.0"
description = "Windows için akıllı oyun kütüphanesi ve başlatıcı"
authors = ["Oyun Arşivim"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# Windows'ta bin ile çakışmaması için lib adı farklı olmalı (cargo#8519).
name = "oyun_arsivim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
